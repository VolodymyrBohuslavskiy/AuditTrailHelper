<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        >
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%2300A1E0' d='M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z'/></svg>">
        <title>Salesforce audit log viewer</title>
    </head>
    <body>
        <div class="mx-3 mt-3">
            <h2><i class="bi bi-cloud-fill me-2 sf-icon"></i>Salesforce audit log viewer</h2>
            <div class="d-flex align-items-center gap-3">
                <input type="file" id="csvFile" accept=".csv">

                <div id="filtersSection" class="d-none align-items-center gap-3">
                    <label class="mb-0" for="user-select">
                        User:
                        <select name="user" id="user-select" class="ms-1">
                            <option>All</option>
                        </select>
                    </label>

                    <label class="mb-0" for="section-select">
                        Section:
                        <select name="section" id="section-select" class="ms-1">
                            <option>All</option>
                        </select>
                    </label>

                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="daySeparatorToggle">
                        <label class="form-check-label" for="daySeparatorToggle">Group by day</label>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultsSection" class="d-none">
            <table class="table table-bordered mx-3 mt-3">
                <thead>
                    <tr>
                        <th></th>
                        <th>#</th>
                        <th>Date</th>
                        <th>User</th>
                        <th>Section</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
